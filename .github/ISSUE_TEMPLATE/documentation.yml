name: Documentation problem
description: Report missing, inaccurate, or unclear LedgerLab documentation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Document or page
      description: Link or path to the affected documentation.
      placeholder: docs/deployment.md#reverse-proxy-and-https
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no private financial or authentication data.
          required: true
