  actions:
    add: Adaugă o etichetă
    renameNamed: "Redenumește {name}"
    restoreNamed: "Restaurează {name}"
    archiveNamed: "Arhivează {name}"
    saving: Se salvează…
    archiving: Se arhivează…
    saveChanges: Salvează modificările
    create: Creează eticheta
  metrics:
    active:
      label: Etichete active
      detail: Disponibile la introducerea tranzacțiilor
    links:
      label: Asocieri cu tranzacții
      detail: Pentru etichetele active
    unused:
      label: Etichete nefolosite
      detail: De verificat
    archived:
      label: Arhivate
      detail: Asocierile sunt păstrate
  section:
    title: Biblioteca de etichete
    description: Numărul de utilizări exclude tranzacțiile anulate.
  toggle:
    label: Arată etichetele arhivate
    description: Include etichetele indisponibile pentru înregistrări noi.
  empty:
    allTitle: Nu există încă nicio etichetă
    activeTitle: Nu există etichete active
    description: Creează o etichetă când ai nevoie de o clasificare care acoperă categorii, comercianți sau conturi.
  table:
    label: Etichete
    tag: Etichetă
    transactions: Tranzacții
    status: Stare
  feedback:
    archived: Eticheta a fost arhivată. Asocierile existente cu tranzacții au fost păstrate.
    restored: Eticheta a fost restaurată.
    updateFailed: Eticheta nu a putut fi actualizată
    created: Eticheta a fost creată.
    updated: Eticheta a fost actualizată. Asocierile existente cu tranzacții folosesc acum noul nume.
  archive:
    title: Arhivezi eticheta?
    description: Nu va mai apărea la introducerea tranzacțiilor noi, însă asocierile și rapoartele istorice rămân intacte.
    confirm: Arhivează eticheta
    notice: "{name} rămâne asociată tranzacțiilor existente."
