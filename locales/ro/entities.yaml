merchants:
  header:
    title: Comercianți
    description: Înregistrările comercianților sunt create din tranzacțiile efective introduse. Uniformizează-le denumirile, atribuie categorii implicite sau arhivează-le fără a rescrie istoricul.
  actions:
    editNamed: "Editează {name}"
    restoreNamed: "Restaurează {name}"
    archiveNamed: "Arhivează {name}"
    saving: Se salvează…
    archiving: Se arhivează…
    saveChanges: Salvează modificările
  metrics:
    active:
      label: Comercianți activi
      detail: Disponibili la introducerea tranzacțiilor
    transactions:
      label: Tranzacții
      detail: Tranzacții efective neanulate
    noDefault:
      label: Fără categorie implicită
