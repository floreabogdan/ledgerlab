    invalidFile: Acesta nu este un fișier JSON de copie de siguranță LedgerLab valid.
    confirmationRequired: Confirmă că înțelegi că baza de date curentă va fi înlocuită.
  restored: Copia de siguranță a fost restaurată. Reîncarcă celelalte file LedgerLab deschise înainte de a face modificări.
  confirmation:
    title: Restaurezi copia completă a bazei de date?
    cancel: Anulează
    restoring: Se restaurează…
    replace: Înlocuiește datele și restaurează
    warning: Această acțiune înlocuiește datele LedgerLab curente.
    warningHelp: Creează mai întâi o copie nouă dacă este posibil să ai nevoie de starea curentă. Sesiunile din celelalte file ale browserului pot rămâne cu date învechite.
    acknowledgement: Înțeleg că datele financiare curente vor fi înlocuite cu cele din copia de siguranță selectată.
