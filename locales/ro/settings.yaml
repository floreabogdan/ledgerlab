data:
  eyebrow: Gestionarea datelor
  title: Date și copii de siguranță
  description: Exportă date portabile despre tranzacții, creează o copie locală completă sau restaurează în siguranță o bază de date LedgerLab anterioară.
  importTransactions: Importă tranzacții
  portable:
    title: Exporturi portabile
    description: Descarcă datele tranzacțiilor efective
    csvTitle: Export CSV
    csvDescription: Tranzacții efective potrivite pentru foi de calcul, cu sumele înregistrate în format lizibil și ca valori întregi, monedele originale și instantaneele FX aplicate.
    csvButton: Descarcă CSV
    jsonTitle: Export JSON
    jsonDescription: Conturi, categorii și tranzacții efective structurate, inclusiv proveniența exactă a cursurilor de schimb aplicate la datele respective.
    jsonButton: Descarcă JSON
  safety:
    title: Protejarea întregii baze de date
    description: Creează o copie de siguranță sau restaurează toate datele locale LedgerLab
    createTitle: Creează o copie completă
    createDescription: Include conturile, soldurile, tranzacțiile, planurile, bugetele, regulile de recurență, setările profilului și memoria cache cu cursurile BNR descărcate.
    createButton: Descarcă copia de siguranță
    restoreTitle: Restaurează o copie de siguranță
    restoreDescription: Validează o copie de siguranță LedgerLab înainte de a înlocui datele utilizatorului local autentificat.
    restoreButton: Alege copia de siguranță
  errors:
    exportFailed: Datele nu au putut fi exportate
    backupFailed: Copia de siguranță nu a putut fi creată
    restoreFailed: Această copie de siguranță nu a putut fi restaurată
