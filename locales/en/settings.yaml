  interfaceGroup: Interface
  interfaceLanguage: Interface language
  interfaceLanguageHelp: Changes the words, labels, and messages shown by LedgerLab. Formatting locale remains a separate setting for dates, numbers, and currencies.
  compactTables: Compact data tables
  compactTablesHelp: Use tighter rows while retaining readable mobile layouts.
