data:
  eyebrow: Data management
  title: Data & backups
  description: Export portable transaction data, create a complete local backup, or safely restore a previous LedgerLab database.
  importTransactions: Import transactions
  portable:
    title: Portable exports
    description: Download actual transaction data
    csvTitle: CSV export
    csvDescription: Spreadsheet-friendly actual transactions with readable and integer posted amounts, original currencies, and applied FX snapshots.
    csvButton: Download CSV
    jsonTitle: JSON export
    jsonDescription: Structured accounts, categories and actual transactions, including exact dated exchange-rate provenance.
    jsonButton: Download JSON
  safety:
    title: Full database safety
    description: Backup or restore all local LedgerLab data
    createTitle: Create full backup
    createDescription: Includes accounts, balances, transactions, plans, budgets, recurrence rules, profile settings, and the downloaded BNR rate cache.
    createButton: Download backup
    restoreTitle: Restore a backup
    restoreDescription: Validates a LedgerLab backup before replacing data for the signed-in local user.
    restoreButton: Choose backup
  errors:
    exportFailed: Could not export data
    backupFailed: Could not create backup
    restoreFailed: Could not restore this backup
    fileTooLarge: Backup files must be smaller than 100 MB.
    invalidFile: This is not a valid LedgerLab JSON backup.
    confirmationRequired: Confirm that you understand the current database will be replaced.
  restored: Backup restored. Reload other open LedgerLab tabs before making changes.
  confirmation:
    title: Restore full database backup?
    cancel: Cancel
    restoring: Restoring…
    replace: Replace data & restore
    warning: This replaces current LedgerLab data.
    warningHelp: Create a fresh backup first if you may need to recover the current state. Sessions for other browser tabs may become stale.
    acknowledgement: I understand that current finance data will be replaced by the selected backup.
