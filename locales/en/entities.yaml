merchants:
  header:
    title: Merchants
    description: Merchant records are created from actual transaction entry. Normalise their names, assign defaults, or archive them without rewriting history.
  actions:
    editNamed: "Edit {name}"
    restoreNamed: "Restore {name}"
    archiveNamed: "Archive {name}"
    saving: Saving…
    archiving: Archiving…
    saveChanges: Save changes
  metrics:
    active:
      label: Active merchants
      detail: Available during entry
    transactions:
      label: Transactions
      detail: Non-void actuals
    noDefault:
      label: Without a default
      detail: Category chosen per entry
    archived:
      label: Archived
      detail: History retained
  section:
    title: Merchant directory
    description: Default categories apply when a matching merchant is used without an explicit category.
  search:
    placeholder: Search merchants or categories
    noMatchesTitle: No merchants match this search
    noMatchesDescription: Try a different merchant or category name.
  toggle:
    label: Show archived
    description: Include merchants unavailable for new matching.
  empty:
    allTitle: No merchants yet
    activeTitle: No active merchants
    description: Merchants appear automatically when you add or import actual transactions.
  table:
    label: Merchants
    merchant: Merchant
    transactions: Transactions
    defaultCategory: Default category
    status: Status
  feedback:
    archived: Merchant archived. Existing transactions still show the original merchant.
    restored: Merchant restored.
    updateFailed: Could not update the merchant
    updated: Merchant updated. Existing linked transactions now use the normalised name.
  archive:
    title: Archive merchant?
    description: It will no longer be matched for new entries. Existing transactions retain their merchant history.
    confirm: Archive merchant
    notice: "{name} remains visible on its existing transactions and reports."
  form:
    title: Edit merchant
    description: Renaming normalises every linked view without changing the original transaction amounts or dates.
    name: Merchant name
    nameRequired: Enter a merchant name.
    defaultCategory: Default category
    defaultCategoryHint: Used only when an entry has no explicit category.
    noDefaultCategory: No default category
